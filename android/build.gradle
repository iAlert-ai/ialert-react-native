buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

apply plugin: "com.android.library"

android {
    namespace = "ir.ialert.reactnative"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
    // `-PialertAndroidLocal`: use the Android SDK from `./gradlew publishToMavenLocal`.
    if (project.hasProperty("ialertAndroidLocal")) mavenLocal()
}

dependencies {
    implementation("com.facebook.react:react-android:+")
    if (project.hasProperty("ialertAndroidLocal")) {
        implementation("ir.ialert:ialert-android:0.5.1")
    } else {
        implementation("com.github.iAlert-ai:ialert-android:v0.5.1")
    }
}
